push:
  name: Push values
  description: Send selected Home Assistant entity values to Živý Obraz immediately.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to push all configured instances.
      selector:
        config_entry:
          integration: zivy_obraz
    name:
      name: Instance name
      description: Optional instance name. Leave empty to push all configured instances.
      example: "Cottage"
      selector:
        text:
    send_all:
      name: Send all
      description: Optional override. When true, send all selected entities. When false, send only changed entities. Leave empty to use integration settings.
      example: true
      selector:
        boolean:
    dry_run:
      name: Dry run
      description: When enabled, preview the selected values without sending them to Živý Obraz.
      example: true
      selector:
        boolean:

push_values:
  name: Push custom values
  description: Send multiple custom values to Živý Obraz immediately.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to push to all configured instances.
      example: "abc123"
      selector:
        config_entry:
          integration: zivy_obraz
    name:
      name: Instance name
      description: Optional instance name. Leave empty to push to all configured instances.
      example: "Cottage"
      selector:
        text:
    values:
      name: Values
      description: List of Živý Obraz variable names and values.
      required: true
      example:
        - variable: "custom_message"
          value: "Hello from Home Assistant"
        - variable: "custom_temperature"
          value: "23.5"
      selector:
        object:
          multiple: true
          label_field: variable
          description_field: value
          fields:
            variable:
              label: Variable name
              required: true
              selector:
                text:
            value:
              label: Value
              required: true
              selector:
                text:

command:
  name: Send device command
  description: Send a Živý Obraz Command API request.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID. Leave empty to target all configured instances with Command key.
      selector:
        config_entry:
          integration: zivy_obraz
    name:
      name: Instance name
      description: Optional instance name. Leave empty to target all configured instances with Command key.
      example: "Cottage"
      selector:
        text:
    target:
      name: Target
      description: "Optional command target: group:id, group:0 or default for the default group, device:id, or device:mac. Leave empty to target all devices managed by this instance."
      example: "device:AA:BB:CC:DD:EE:FF"
      selector:
        text:
    caption:
      name: Caption
      description: Device display name. Must contain 1 to 255 characters.
      selector:
        text:
    note:
      name: Note
      description: Device note with up to 255 characters. Empty value clears the note.
      selector:
        text:
    pin_key:
      name: PIN key
      description: Device PIN key. Empty value clears the PIN.
      selector:
        text:
    invert_screen:
      name: Invert screen
      description: Display color inversion behavior.
      selector:
        select:
          options:
            - label: Use display setting
              value: default
            - label: Always invert
              value: always
            - label: Never invert
              value: never
    ota:
      name: OTA firmware updates
      description: Enable or disable OTA firmware updates.
      selector:
        boolean:
    refresh_screen:
      name: Refresh display
      description: Enable or disable display refresh.
      selector:
        boolean:
    rotate_180:
      name: Rotate 180 degrees
      description: Rotate the display 180 degrees.
      selector:
        boolean:
    show_ap_connect_screen:
      name: Show AP connect screen
      description: Show the AP connection screen.
      selector:
        boolean:
    sleep_forced:
      name: Forced sleep
      description: Sleep duration when refresh is disabled, in minutes.
      example: 120
      selector:
        number:
          min: 5
          max: 240
          step: 1
          mode: box
